[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "memo"
version = "0.1.0"
description = "Cross-platform desktop memo / sticky-note app for tracking todos with Markdown notes"
# Python 3.11 + PySide6 6.4 are pinned to match Ubuntu 24.04's system Qt 6.4.2,
# which is the version of the fcitx5 Qt6 IM plugin bundled in our PyInstaller
# build. Keeping these in lock-step is what lets Chinese input work in the
# packaged binary.
requires-python = ">=3.11,<3.12"
dependencies = [
    "PySide6==6.4.*",
    "platformdirs>=4.0",
    "pynput>=1.7",
    "qtawesome>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
memo = "memo.app:main"

[tool.setuptools.packages.find]
include = ["memo*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
